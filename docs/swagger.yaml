definitions:
  handler.ShortenTaskReq:
    properties:
      url:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Сервис сокращения ссылок
  title: URL Shortener API
  version: "1.0"
paths:
  /{id}:
    get:
      description: Принимает короткий ID и редиректит на оригинальный URL
      parameters:
      - description: Короткий ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "301":
          description: Редирект
          schema:
            type: string
        "404":
          description: Not found
          schema:
            type: string
        "500":
          description: Internal error
          schema:
            type: string
      summary: Редирект по короткой ссылке
      tags:
      - urls
  /shorten:
    post:
      consumes:
      - application/json
      description: Принимает оригинальный URL и возвращает короткий
      parameters:
      - description: URL для сокращения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenTaskReq'
      produces:
      - application/json
      responses:
        "201":
          description: короткий ID
          schema:
            type: string
        "400":
          description: Invalid JSON
          schema:
            type: string
      summary: Сократить URL
      tags:
      - urls
swagger: "2.0"
